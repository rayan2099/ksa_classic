<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">KSA Collection</title>
  <desc id="desc">KSA Collection logo with a black background, gold border, gold KSA text, and bright collection text.</desc>
  <defs>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="60" fill="#0b0b0b"/>
  <rect x="28" y="28" width="456" height="456" rx="42" fill="none" stroke="#d0ac43" stroke-width="16" filter="url(#softShadow)"/>
  <text
    x="256"
    y="230"
    text-anchor="middle"
    fill="#d0ac43"
    font-family="Arial, Helvetica, sans-serif"
    font-size="126"
    font-weight="900"
    letter-spacing="6"
  >KSA</text>
  <line x1="146" y1="286" x2="366" y2="286" stroke="#d0ac43" stroke-width="9" stroke-linecap="round"/>
  <text
    x="256"
    y="365"
    text-anchor="middle"
    fill="#ffffff"
    font-family="Arial, Helvetica, sans-serif"
    font-size="46"
    font-weight="900"
    letter-spacing="7"
  >COLLECTION</text>
</svg>
